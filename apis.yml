aid: brightinsight
name: BrightInsight
description: >-
  BrightInsight is a regulated digital health platform for biopharma and medtech.
  Its cloud-based, microservices platform captures, transmits and analyzes data
  from CE-marked and FDA-regulated medical devices, combination products, apps
  and Software as a Medical Device (SaMD) in compliance with global security,
  privacy and regulatory requirements. The platform integrates with 400+ medical
  devices across 50+ manufacturers, connects to EHRs in 500+ U.S. provider
  networks, and is available in 48 countries. Founded in 2017 (formerly Flex
  Digital Health) and based in Alviso, California, BrightInsight is used by top
  biopharma and medtech companies to build and launch commercial regulated
  digital health solutions. It is a sales-led enterprise platform with no public
  developer portal or public API; integration is delivered under managed
  engagements.
